<!-- ========================================================================= -->
<!-- GLOBAL APPLICATION NAVBAR TEMPLATE (Responsive & Documented)             -->
<!-- ========================================================================= -->
<header class="h-16 w-full bg-white/95 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between px-3 sm:px-6 transition-all duration-300 sticky top-0 z-40">

  <!-- 1. LEFT SECTION (Sidebar Toggle Button aur Global Search Input) -->
  <div class="flex items-center gap-2 sm:gap-3">

    <!-- Sidebar Toggle Button (Mobile & Desktop par sidebar collapse/expand karne ke liye) -->
    <button
      (click)="toggleSidebar()"
      type="button"
      aria-label="Toggle Sidebar"
      class="rounded-xl p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer">
      <span class="material-symbols-outlined text-xl">
        menu
      </span>
    </button>

    <!-- Global Search (Routes ya buses search karne ke liye input field - chote screens par hidden hai) -->
    <div class="relative hidden sm:block">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none">
        search
      </span>
      <input
        type="text"
        placeholder="Search routes, buses..."
        class="w-48 md:w-56 lg:w-64 rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-4 text-xs text-slate-800 placeholder-slate-400 outline-none transition-all focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-medium" />
    </div>

  </div>

  <!-- 2. RIGHT SECTION (Notifications aur User Profile Dropdown) -->
  <div class="flex items-center gap-2 sm:gap-3">

    <!-- Notification Button (Optional / Future use ke liye ready) -->
    <!-- 
    <button
      type="button"
      class="relative rounded-xl p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer">
      <span class="material-symbols-outlined text-xl">
        notifications
      </span>
      <span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-red-500 ring-2 ring-white">
      </span>
    </button> 
    -->

    <!-- Divider (Visual separator for larger screens) -->
    <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>

    <!-- User Profile Dropdown Wrapper -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleDropdown($event)"
        aria-haspopup="true"
        [attr.aria-expanded]="isDropdownOpen"
        class="flex items-center gap-2 rounded-xl p-1.5 hover:bg-slate-100 transition-colors group cursor-pointer">

        <!-- User Avatar Initial Box -->
        <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white font-semibold text-xs shadow-xs group-hover:bg-blue-700 transition-colors shrink-0">
          M
        </div>

        <!-- User Name & Role Details (Medium screens aur upar visible, mobile par clean look ke liye hidden) -->
        <div class="hidden md:block text-left">
          <p class="text-xs font-semibold text-slate-900 leading-tight">
            Muhammad Zeeshan
          </p>
          <p class="text-[10px] text-slate-500 font-medium">
            Admin
          </p>
        </div>

        <!-- Dropdown Arrow Icon (Toggle state ke mutabiq smoothly rotate hoga) -->
        <span class="material-symbols-outlined text-slate-400 group-hover:text-slate-700 transition-transform duration-200 text-sm" [class.rotate-180]="isDropdownOpen">
          expand_more
        </span>
      </button>

      <!-- Dropdown Menu Box (Conditionally Rendered when isDropdownOpen is true) -->
      @if (isDropdownOpen) {
        <div
          tabindex="0"
          role="menu"
          (click)="$event.stopPropagation()"
          (keydown.escape)="toggleDropdown($event)"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()"
          class="absolute right-0 mt-2 w-48 rounded-2xl bg-white border border-slate-200/80 shadow-xl py-1.5 z-50 animate-in fade-in slide-in-from-top-2 duration-150 focus:outline-none focus:ring-2 focus:ring-blue-100">

          <!-- My Profile Button -->
          <button
            type="button"
            role="menuitem"
            (click)="goToProfile()"
            class="w-full px-4 py-2.5 text-left text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-base text-slate-500">person</span>
            <span>My Profile</span>
          </button>

          <!-- Divider -->
          <div class="my-1 border-t border-slate-100"></div>

          <!-- Logout Button -->
          <button
            type="button"
            role="menuitem"
            (click)="logout()"
            class="w-full px-4 py-2.5 text-left text-xs font-semibold text-rose-600 hover:bg-rose-50 flex items-center gap-2.5 transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-base text-rose-500">logout</span>
            <span>Logout</span>
          </button>

        </div>
      }
    </div>

  </div>

</header>
