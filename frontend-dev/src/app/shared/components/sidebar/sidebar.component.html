<!-- ========================================================================= -->
<!-- GLOBAL APPLICATION SIDEBAR TEMPLATE (Responsive & Documented)             -->
<!-- ========================================================================= -->
<aside 
  [class.w-60]="isSidebarOpen" 
  [class.w-0]="!isSidebarOpen" 
  class="h-full bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 transition-all duration-300 ease-in-out z-40 overflow-hidden shrink-0 absolute lg:relative inset-y-0 left-0 shadow-xl lg:shadow-none">

  <!-- 1. LOGO HEADER SECTION (App ka icon, brand name aur subtitle) -->
  <div class="h-16 flex items-center px-4 border-b border-slate-800 shrink-0 w-60">
    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600/15 text-blue-500 ring-1 ring-blue-500/30 shrink-0">
      <span class="material-symbols-outlined text-xl">directions_bus</span>
    </div>
    <div class="ml-3 overflow-hidden">
      <h2 class="text-xs font-bold text-white tracking-wide leading-tight truncate">
        Bus Tracking
      </h2>
      <p class="text-[9px] font-semibold text-blue-400 tracking-wider uppercase truncate">
        Booking App
      </p>
    </div>
  </div>

  <!-- 2. NAVIGATION LINKS CONTAINER (Scrollable role-based filtered list jiska scrollbar hidden hai) -->
  <nav class="flex-1 px-3 py-3 space-y-1 overflow-y-auto [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] scrollbar-none w-60">
    @for (item of filteredNavItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-600 text-white font-semibold shadow-sm shadow-blue-600/30"
        [routerLinkActiveOptions]="{ exact: item.exact || false }"
        class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-xs text-slate-400 hover:bg-slate-800/80 hover:text-slate-100 transition-all duration-150 cursor-pointer font-medium">
        
        <!-- Navigation Icon -->
        <span class="material-symbols-outlined text-lg shrink-0">{{ item.icon }}</span>
        
        <!-- Navigation Label -->
        <span class="truncate">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- 3. SIDEBAR FOOTER / DYNAMIC BOTTOM ACTIONS (Jaise Logout Button) -->
  <div class="p-3 border-t border-slate-800 shrink-0 bg-slate-900 space-y-1 w-60">
    @for (action of bottomActions; track action.action) {
      <button
        type="button"
        (click)="handleAction(action.action)"
        [class]="'w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-xs transition-all duration-150 cursor-pointer font-medium ' + action.cssClass">
        
        <!-- Action Icon -->
        <span class="material-symbols-outlined text-lg shrink-0">{{ action.icon }}</span>
        
        <!-- Action Label -->
        <span class="truncate">{{ action.label }}</span>
      </button>
    }
  </div>

</aside>
