<!-- 404 NOT FOUND COMPONENT TEMPLATE                                          -->
<!-- ========================================================================= -->
<div class="flex flex-col items-center justify-center min-h-[80vh] text-center px-4">
      <div class="space-y-4">
        
        <!-- 1. 404 ERROR HEADING (Bada error code indicator) -->
        <h1 class="text-6xl font-extrabold text-red-600 tracking-wider">404</h1>
        
        <!-- 2. ERROR TITLE (Friendly user message) -->
        <h2 class="text-2xl font-bold text-gray-800">Oops! Page Not Found</h2>
        
        <!-- 3. DESCRIPTION (Explain karne ke liye ke page kyun nahi mila) -->
        <p class="text-gray-600 max-w-md mx-auto">
        It looks like you've taken a wrong path. This page either doesn't exist or has been moved.
        </p>

        <!-- 4. BACK TO HOME / DASHBOARD BUTTON (User ko wapis main app mein lane ke liye) -->
        <div class="pt-4">
          <a routerLink="/dashboard" class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg shadow hover:bg-blue-700 transition duration-200">
            Go to Dashboard
          </a>
        </div>

      </div>
    </div>
