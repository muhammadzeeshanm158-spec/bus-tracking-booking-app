<!-- ========================================================================= -->
<!-- FORGOT PASSWORD COMPONENT TEMPLATE (Responsive & Documented)             -->
<!-- ========================================================================= -->
<div class="w-full max-w-md rounded-2xl bg-white p-5 sm:p-8 border border-slate-200/80 shadow-xl shadow-slate-200/50 transition-all duration-300">

  <!-- 1. HEADER SECTION (Title aur Subtitle) -->
  <div class="text-center mb-6">
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
      Forgot Password
    </h1>
    <p class="mt-1 text-xs text-slate-500 font-medium">
      Enter your email address to receive a password reset link.
    </p>
  </div>

  <!-- 2. FORGOT PASSWORD FORM -->
  <form class="space-y-4">

    <!-- Email Input Field Group -->
    <div>
      <label for="email" class="block mb-1.5 text-[10px] font-bold text-slate-700 uppercase tracking-wider">
        Email Address
      </label>

      <div class="relative">
        <!-- Input Icon -->
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none select-none">
          mail
        </span>

        <!-- Email Text Input -->
        <input
          id="email"
          type="email"
          required
          placeholder="name@example.com"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-3.5 text-xs text-slate-800 placeholder-slate-400 outline-none transition-all focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-medium">
      </div>
    </div>

    <!-- Submit Action Button -->
    <button
      type="submit"
      class="w-full cursor-pointer rounded-xl bg-blue-600 py-2.5 font-semibold text-white text-xs transition-all duration-200 hover:bg-blue-700 active:scale-[0.98] shadow-sm shadow-blue-600/30 flex items-center justify-center gap-1.5 mt-2">
      <span>Send Reset Link</span>
    </button>

    <!-- Back to Login Navigation Link -->
    <div class="mt-5 text-center pt-4 border-t border-slate-100">
      <p class="text-slate-500 text-xs font-medium">
        Remember your password?
        <a routerLink="/auth/login" class="ml-1 font-semibold text-blue-600 hover:text-blue-700 hover:underline transition-colors">
          Back to login
        </a>
      </p>
    </div>

  </form>

</div>
