<!-- ========================================================================= -->
<!-- RESET PASSWORD COMPONENT                                                  -->
<!-- ========================================================================= -->
<div class="w-full max-w-md rounded-2xl bg-white p-6 sm:p-8 border border-slate-200/80 shadow-xs transition-all duration-300">

  <!-- Heading -->
  <div class="text-center mb-6">
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
      Reset Password
    </h1>
    <p class="mt-1 text-xs text-slate-500">
      Create a new secure password for your account.
    </p>
  </div>

  <form class="space-y-4">

    <!-- New Password -->
    <div>
      <label for="newPassword" class="block mb-1.5 text-[10px] font-bold text-slate-700 uppercase tracking-wider">
        New Password
      </label>

      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none select-none">
          lock
        </span>

        <input
          id="newPassword"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-10 text-xs text-slate-800 placeholder-slate-400 outline-none transition-all focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-medium">

        <button
          type="button"
          tabindex="-1"
          (click)="togglePassword()"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition outline-none cursor-pointer">
          <span class="material-symbols-outlined select-none block text-base">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="confirmPassword" class="block mb-1.5 text-[10px] font-bold text-slate-700 uppercase tracking-wider">
        Confirm Password
      </label>

      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none select-none">
          lock
        </span>

        <input
          id="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="••••••••"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-10 text-xs text-slate-800 placeholder-slate-400 outline-none transition-all focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-100 font-medium">

        <button
          type="button"
          tabindex="-1"
          (click)="toggleConfirmPassword()"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition outline-none cursor-pointer">
          <span class="material-symbols-outlined select-none block text-base">
            {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>
    </div>

    <!-- Button -->
    <button
      type="submit"
      class="w-full cursor-pointer rounded-xl bg-blue-600 py-2.5 font-semibold text-white text-xs transition-all duration-200 hover:bg-blue-700 shadow-xs flex items-center justify-center gap-1.5 mt-2">
      <span>Reset Password</span>
    </button>

    <!-- Back to Login -->
    <div class="mt-5 text-center pt-2 border-t border-slate-100">
      <a routerLink="/auth/login" class="inline-block cursor-pointer font-semibold text-blue-600 hover:underline text-xs">
        Back to login
      </a>
    </div>

  </form>

</div>
